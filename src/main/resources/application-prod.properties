# prod 환경에서만 적용되는 override.
# 활성화: SPRING_PROFILES_ACTIVE=prod 환경변수
# (베이스 application.properties의 spring.profiles.active=${SPRING_PROFILES_ACTIVE:dev}에 의해 자동 머지됨)

# === SQL 로깅 차단 ===
# dev에선 디버깅용으로 SQL을 보지만 prod에선 disk/console 부담 + 민감정보 유출 가능성 차단.
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false

# === 로그 레벨 ===
logging.level.root=INFO
logging.level.com.example.Naengbuhae=INFO
logging.level.org.springframework.security=WARN
logging.level.org.hibernate.SQL=WARN
logging.level.org.hibernate.orm.jdbc.bind=WARN

# === 에러 응답 단순화 ===
# stack trace / 메시지가 응답으로 새지 않도록.
server.error.include-stacktrace=never
server.error.include-message=never
server.error.include-binding-errors=never

# === Actuator (운영에서도 health만 공개) ===
# 추가로 info를 열고 싶으면 여기서 include 확장.
management.endpoint.health.show-details=never

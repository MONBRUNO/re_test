# prod 환경에서만 적용되는 override.
# 활성화: SPRING_PROFILES_ACTIVE=prod 환경변수
# (베이스 application.properties의 spring.profiles.active=${SPRING_PROFILES_ACTIVE:dev}에 의해 자동 머지됨)

# === SQL 로깅 차단 ===
# dev에선 디버깅용으로 SQL을 보지만 prod에선 disk/console 부담 + 민감정보 유출 가능성 차단.
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false

# === 로그 레벨 ===
logging.level.root=INFO
logging.level.com.example.Naengbuhae=INFO
logging.level.org.springframework.security=WARN
logging.level.org.hibernate.SQL=WARN
logging.level.org.hibernate.orm.jdbc.bind=WARN

# === 에러 응답 단순화 ===
# stack trace / 메시지가 응답으로 새지 않도록.
server.error.include-stacktrace=never
server.error.include-message=never
server.error.include-binding-errors=never

# === Actuator (운영에서도 health만 공개) ===
# 추가로 info를 열고 싶으면 여기서 include 확장.
management.endpoint.health.show-details=never

# === Sentry (에러 모니터링) ===
# DSN은 Render 환경변수 SENTRY_DSN으로 주입. 비어있으면 Sentry SDK가 자동 no-op.
sentry.dsn=${SENTRY_DSN:}
sentry.environment=prod
sentry.send-default-pii=false
# 성능 트레이스는 무료 한도(5K events/월) 보호 위해 끄고 시작. 필요시 0.1 등으로 올리기.
sentry.traces-sample-rate=0.0
# ERROR 레벨만 Sentry로 전송. WARN까지 보내고 싶으면 WARN으로 변경.
sentry.logging.minimum-event-level=error

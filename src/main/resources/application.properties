spring.application.name=Naengbuhae
spring.config.import=optional:file:.env[.properties]

# Profile: \uAE30\uBCF8\uC740 dev. \uC6B4\uC601\uC5D0\uC120 SPRING_PROFILES_ACTIVE=prod \uD658\uACBD\uBCC0\uC218\uB85C application-prod.properties\uAC00 \uCD94\uAC00 \uB85C\uB4DC\uB428.
spring.profiles.active=${SPRING_PROFILES_ACTIVE:dev}

# Actuator: health endpoint\uB9CC \uB178\uCD9C. \uBCF4\uC548\uC0C1 info/metrics \uB4F1\uC740 \uAE30\uBCF8 \uBE44\uACF5\uAC1C.
management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=when-authorized

# \uD83D\uDCA1 1. DB \uC124\uC815: \uD658\uACBD\uBCC0\uC218(DB_URL)\uB97C \uBA3C\uC800 \uCC3E\uACE0, \uC5C6\uC73C\uBA74 Supabase \uAE30\uBCF8 \uC8FC\uC18C \uC0AC\uC6A9
spring.datasource.url=${DB_URL:jdbc:postgresql://aws-1-ap-northeast-2.pooler.supabase.com:5432/postgres}
spring.datasource.username=${DB_USERNAME:postgres.lulvkjjxtmnvvqvnatbp}
spring.datasource.password=${DB_PASSWORD}

# JPA
spring.datasource.driver-class-name=org.postgresql.Driver
spring.jpa.hibernate.ddl-auto=update
# spring.jpa.hibernate.ddl-auto=create
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# N+1 \uBC29\uC9C0: lazy collection\uC774 \uB85C\uB4DC\uB420 \uB54C IN \uC808\uB85C \uD55C \uBC88\uC5D0 \uBB36\uC5B4 fetch.
# 100\uAC1C\uC529 \uBB36\uC74C \u2014 \uCEEC\uB809\uC158\uC774 \uADF8\uBCF4\uB2E4 \uB9CE\uC73C\uBA74 ceil(N/100)\uAC1C\uC758 \uCD94\uAC00 \uCFFC\uB9AC\uB85C \uCC98\uB9AC.
spring.jpa.properties.hibernate.default_batch_fetch_size=100

# === OAuth2 (\uCE74\uCE74\uC624) ===
# .env \uD30C\uC77C\uC5D0 KAKAO_CLIENT_ID \uCD94\uAC00 \uD544\uC694. KAKAO_CLIENT_SECRET\uC740 \uC0AC\uC6A9 \uC2DC\uC5D0\uB9CC \uCD94\uAC00.
spring.security.oauth2.client.registration.kakao.client-id=${KAKAO_CLIENT_ID:}
spring.security.oauth2.client.registration.kakao.client-secret=${KAKAO_CLIENT_SECRET:}

# \uD68C\uC6D0 \uD0C8\uD1F4 \uC2DC \uCE74\uCE74\uC624 \uC5F0\uACB0 \uD574\uC81C\uC6A9 Admin Key. \uCE74\uCE74\uC624 \uAC1C\uBC1C\uC790 \uCF58\uC194 > \uC571 \uC124\uC815 > \uC571 \uD0A4 > Admin Key.
# \uBBF8\uC124\uC815 \uC2DC unlink \uC2A4\uD0B5 (\uD0C8\uD1F4\uB294 \uC815\uC0C1 \uC9C4\uD589\uB428, \uCE74\uCE74\uC624 \uCE21 \uC5F0\uACB0\uB9CC \uB0A8\uC74C).
app.oauth.kakao.admin-key=${KAKAO_ADMIN_KEY:}
spring.security.oauth2.client.registration.kakao.client-authentication-method=client_secret_post
spring.security.oauth2.client.registration.kakao.authorization-grant-type=authorization_code
spring.security.oauth2.client.registration.kakao.redirect-uri={baseUrl}/login/oauth2/code/{registrationId}
spring.security.oauth2.client.registration.kakao.scope=profile_nickname
spring.security.oauth2.client.registration.kakao.client-name=Kakao

spring.security.oauth2.client.provider.kakao.authorization-uri=https://kauth.kakao.com/oauth/authorize
spring.security.oauth2.client.provider.kakao.token-uri=https://kauth.kakao.com/oauth/token
spring.security.oauth2.client.provider.kakao.user-info-uri=https://kapi.kakao.com/v2/user/me
spring.security.oauth2.client.provider.kakao.user-name-attribute=id

# === OAuth2 (\uAD6C\uAE00) ===
# Spring Security\uAC00 google provider\uB97C \uB0B4\uC7A5 \uC9C0\uC6D0\uD558\uBBC0\uB85C provider URL\uC740 \uBCC4\uB3C4 \uC124\uC815 \uBD88\uD544\uC694.
# .env\uC5D0 GOOGLE_CLIENT_ID / GOOGLE_CLIENT_SECRET \uCD94\uAC00 \uD544\uC694.
spring.security.oauth2.client.registration.google.client-id=${GOOGLE_CLIENT_ID:}
spring.security.oauth2.client.registration.google.client-secret=${GOOGLE_CLIENT_SECRET:}
spring.security.oauth2.client.registration.google.scope=profile,email

# === OAuth2 (\uB124\uC774\uBC84) ===
# \uB124\uC774\uBC84\uB294 Spring Security \uB0B4\uC7A5 provider\uAC00 \uC544\uB2C8\uBBC0\uB85C provider URL\uC744 \uC9C1\uC811 \uC9C0\uC815.
# \uCF58\uC194 'OAuth \uB3D9\uC758\uD56D\uBAA9'\uC5D0\uC11C \uC774\uBA54\uC77C/\uBCC4\uBA85/\uC131\uBCC4/\uC0DD\uC77C/\uCD9C\uC0DD\uC5F0\uB3C4 \uCCB4\uD06C\uB418\uC5B4 \uC788\uC5B4\uC57C \uC751\uB2F5\uC73C\uB85C \uC634.
spring.security.oauth2.client.registration.naver.client-id=${NAVER_CLIENT_ID:}
spring.security.oauth2.client.registration.naver.client-secret=${NAVER_CLIENT_SECRET:}
spring.security.oauth2.client.registration.naver.client-authentication-method=client_secret_post
spring.security.oauth2.client.registration.naver.authorization-grant-type=authorization_code
spring.security.oauth2.client.registration.naver.redirect-uri={baseUrl}/login/oauth2/code/{registrationId}
spring.security.oauth2.client.registration.naver.scope=name,email,gender,birthday,birthyear
spring.security.oauth2.client.registration.naver.client-name=Naver

spring.security.oauth2.client.provider.naver.authorization-uri=https://nid.naver.com/oauth2.0/authorize
spring.security.oauth2.client.provider.naver.token-uri=https://nid.naver.com/oauth2.0/token
spring.security.oauth2.client.provider.naver.user-info-uri=https://openapi.naver.com/v1/nid/me
spring.security.oauth2.client.provider.naver.user-name-attribute=response

# OAuth \uC778\uC99D \uC131\uACF5 \uC2DC \uD504\uB860\uD2B8\uC758 \uCF5C\uBC31 \uD398\uC774\uC9C0 (.env\uC5D0\uC11C override \uAC00\uB2A5)
app.oauth2.frontend-redirect=${OAUTH2_FRONTEND_REDIRECT:http://localhost:5173/oauth/callback}

# === JWT / Refresh Token \uB9CC\uB8CC \uC2DC\uAC04 ===
# access token: 30\uBD84 (1800000ms). \uD14C\uC2A4\uD2B8 \uC2DC .env\uC5D0\uC11C JWT_ACCESS_TOKEN_EXPIRATION_MS\uB85C override.
app.jwt.access-token-expiration-ms=${JWT_ACCESS_TOKEN_EXPIRATION_MS:1800000}

# refresh token: 365\uC77C (31536000000ms). \uB85C\uADF8\uC778 \uC0C1\uD0DC \uC720\uC9C0 UX \uC9C0\uC6D0.
# \uD65C\uC131 \uC0AC\uC6A9\uC790\uB294 rotation\uC73C\uB85C \uC0AC\uC2E4\uC0C1 \uC601\uAD6C \uB85C\uADF8\uC778. 1\uB144\uAC04 \uBBF8\uC0AC\uC6A9 \uC2DC \uC7AC\uB85C\uADF8\uC778 \uAC15\uC81C.
# \uD14C\uC2A4\uD2B8 \uC2DC .env\uC5D0\uC11C REFRESH_TOKEN_EXPIRATION_MS\uB85C override.
app.jwt.refresh-token-expiration-ms=${REFRESH_TOKEN_EXPIRATION_MS:31536000000}

# \uC7AC\uC0AC\uC6A9 \uD0D0\uC9C0 grace period (\uCD08): rotation\uC73C\uB85C \uD3D0\uAE30\uB41C \uC9C1\uD6C4 N\uCD08 \uB0B4\uC5D0 \uC7AC\uC81C\uCD9C\uB418\uBA74
# multi-tab race\uB85C \uAC04\uC8FC\uD574 \uB3C4\uB09C \uCC98\uB9AC \uC548 \uD568. \uB108\uBB34 \uAE38\uBA74 \uB3C4\uB09C \uD0D0\uC9C0 \uB454\uD574\uC9D0, \uB108\uBB34 \uC9E7\uC73C\uBA74 \uC815\uC0C1 \uB2E4\uD0ED \uC0AC\uC6A9\uC790\uAC00 \uAC15\uC81C \uB85C\uADF8\uC544\uC6C3\uB428.
app.refresh-token.reuse-grace-seconds=${REFRESH_TOKEN_REUSE_GRACE_SECONDS:30}

# \uD3D0\uAE30\uB41C \uD1A0\uD070 row \uBCF4\uC874 \uAE30\uAC04 (\uC2DC\uAC04): \uC774 \uC2DC\uAC04\uC774 \uC9C0\uB098\uBA74 cleanup \uC2A4\uCF00\uC904\uB7EC\uAC00 \uC0AD\uC81C.
# \uBCF4\uC874 \uB3D9\uC548\uC5D4 \uC7AC\uC0AC\uC6A9 \uD0D0\uC9C0 \uAC00\uB2A5. \uC9E7\uC73C\uBA74 \uB3C4\uB09C \uD0D0\uC9C0 \uC2DC\uAC04 \uC904\uC5B4\uB4E6, \uAE38\uBA74 DB \uBD80\uD53C \uCEE4\uC9D0.
app.refresh-token.revoked-retention-hours=${REFRESH_TOKEN_REVOKED_RETENTION_HOURS:24}

# === CORS / JWT secret (\uBCD1\uD569 \uC2DC \uCD94\uAC00) ===
# SecurityConfig\uAC00 cors.allowed.origins\uB85C \uBCC0\uACBD\uB428. setAllowedOriginPatterns\uC6A9 wildcard \uD328\uD134 \uADF8\uB300\uB85C.
cors.allowed.origins=${ALLOWED_ORIGINS:http://localhost:*,http://127.0.0.1:*}

# JwtUtil\uC774 jwt.secret\uC73C\uB85C \uBCC0\uACBD\uB428. \uD658\uACBD\uBCC0\uC218 \uBBF8\uC124\uC815 \uC2DC \uC548\uC804\uD55C 64\uBC14\uC774\uD2B8 \uAE30\uBCF8\uD0A4.
jwt.secret=${JWT_SECRET_KEY:this_is_a_very_long_default_secret_key_for_local_development_environment_12345!}

# === DB Connection Pool (HikariCP) ===
# Supabase \uBB34\uB8CC \uD2F0\uC5B4 \uC81C\uD55C\uC744 \uACE0\uB824\uD558\uC5EC \uCD5C\uB300 \uCEE4\uB125\uC158 \uC218\uB97C 10\uAC1C\uB85C \uC81C\uD55C
spring.datasource.hikari.maximum-pool-size=10
# (\uC704\uCABD\uC758 connection-timeout=30000\uC740 \uD55C \uBC88 \uC4F0\uC774\uACE0, \uC544\uB798\uB294 \uB354 \uBE60\uB974\uAC8C fail-fast \uD558\uB294 \uAC12. \uD6C4\uC790\uAC00 \uC801\uC6A9\uB428)
spring.datasource.hikari.connection-timeout=20000

# === Audit Log \uC124\uC815 ===
# \uAC10\uC0AC \uB85C\uADF8 \uBCF4\uAD00 \uC8FC\uAE30 (\uC77C \uB2E8\uC704)
app.audit.retention-days=180

# === \uC678\uBD80 AI \uC11C\uBC84 \uC124\uC815 (FastAPI) ===
# \uD658\uACBD\uBCC0\uC218 AI_SERVER_URL\uC774 \uC788\uC73C\uBA74 \uADF8\uAC78 \uC4F0\uACE0, \uC5C6\uC73C\uBA74 \uB85C\uCEEC \uC8FC\uC18C\uB97C \uAE30\uBCF8\uC73C\uB85C \uC0AC\uC6A9\uD568
ai.server.url=${AI_SERVER_URL:http://localhost:8000/api/recommend}

# === Gemini Vision API (\uC2DD\uC7AC\uB8CC \uC0AC\uC9C4 \uC778\uC2DD) ===
# .env\uC5D0 GEMINI_API_KEY \uCD94\uAC00. \uD0A4\uAC00 \uBE44\uC5B4\uC788\uC73C\uBA74 /recognize \uC5D4\uB4DC\uD3EC\uC778\uD2B8\uAC00 503 \uBC18\uD658.
gemini.api.key=${GEMINI_API_KEY:}

# === \uC774\uBA54\uC77C (Gmail SMTP) ===
# .env\uC5D0 MAIL_USERNAME (Gmail \uC8FC\uC18C) + MAIL_APP_PASSWORD (\uC571 \uBE44\uBC00\uBC88\uD638 16\uC790\uB9AC) \uC124\uC815.
# myaccount.google.com/apppasswords \uC5D0\uC11C \uBC1C\uAE09.
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_APP_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true

# \uBA54\uC77C\uC5D0 \uC801\uD790 \uBC1C\uC2E0\uC790 \uD45C\uC2DC\uBA85 + \uC0AC\uC6A9\uC790\uAC00 \uD074\uB9AD\uD560 \uB9C1\uD06C\uC758 base URL
app.mail.from-name=${MAIL_FROM_NAME:Naengbuhae}
app.mail.web-base-url=${MAIL_WEB_BASE_URL:http://localhost:5173}
# multipart \uD30C\uC77C \uD06C\uAE30 \uC81C\uD55C (Spring \uAE30\uBCF8\uC740 1MB\uB77C \uC0AC\uC9C4 \uBCF4\uB0B4\uBA74 \uC798\uB9AC\uB294 \uACBD\uC6B0 \uC788\uC74C)
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

# === FCM Push (\uBAA8\uBC14\uC77C \uC571 \uBA64\uBC84/\uCD08\uB300 \uC54C\uB9BC) ===
# Firebase Console > \uD504\uB85C\uC81D\uD2B8 \uC124\uC815 > \uC11C\uBE44\uC2A4 \uACC4\uC815 > \uC0C8 \uBE44\uACF5\uAC1C \uD0A4 \uC0DD\uC131 \u2192 JSON \uB2E4\uC6B4\uB85C\uB4DC \uD6C4 \uACBD\uB85C \uC9C0\uC815.
# \uBBF8\uC124\uC815 \uC2DC FCM \uBE44\uD65C\uC131\uD654 (\uC11C\uBC84\uB294 \uC815\uC0C1 \uAE30\uB3D9, \uD478\uC2DC\uB9CC \uC548 \uAC10).
# \uC6B4\uC601 \uAD8C\uC7A5: file:/etc/secrets/firebase-service-account.json
# \uB85C\uCEEC \uAC1C\uBC1C: classpath:firebase-service-account.json (resources/ \uC544\uB798 \uB450\uACE0 .gitignore)
# === \uC2DD\uC57D\uCC98 API \uC124\uC815 ===
# \uC2DD\uC57D\uCC98 API \uD0A4 (.env \uAE08\uACE0\uC5D0\uC11C \uAC00\uC838\uC624\uAE30)
foodsafety.api.key=${FOOD_SAFETY_API_KEY:}

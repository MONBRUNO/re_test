spring.application.name=Naengbuhae
spring.config.import=optional:file:.env[.properties]

# Profile: 기본은 dev. 운영에선 SPRING_PROFILES_ACTIVE=prod 환경변수로 application-prod.properties가 추가 로드됨.
spring.profiles.active=${SPRING_PROFILES_ACTIVE:dev}

# Actuator: health endpoint만 노출. 보안상 info/metrics 등은 기본 비공개.
management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=when-authorized

# \uD83D\uDCA1 1. DB \uC124\uC815: \uD658\uACBD\uBCC0\uC218(DB_URL)\uB97C \uBA3C\uC800 \uCC3E\uACE0, \uC5C6\uC73C\uBA74 Supabase \uAE30\uBCF8 \uC8FC\uC18C \uC0AC\uC6A9
spring.datasource.url=${DB_URL:jdbc:postgresql://aws-1-ap-northeast-2.pooler.supabase.com:5432/postgres}
spring.datasource.username=${DB_USERNAME:postgres.lulvkjjxtmnvvqvnatbp}
spring.datasource.password=${DB_PASSWORD}

# \uD83D\uDCA1 2. \uD074\uB77C\uC6B0\uB4DC DB(Supabase) \uB124\uD2B8\uC6CC\uD06C \uC9C0\uC5F0 \uB300\uBE44 \uCEE4\uB125\uC158 \uD0C0\uC784\uC544\uC6C3 \uC124\uC815 (30\uCD08)
spring.datasource.hikari.connection-timeout=30000

# JPA
spring.datasource.driver-class-name=org.postgresql.Driver
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# N+1 방지: lazy collection이 로드될 때 IN 절로 한 번에 묶어 fetch.
# 100개씩 묶음 — 컬렉션이 그보다 많으면 ceil(N/100)개의 추가 쿼리로 처리.
spring.jpa.properties.hibernate.default_batch_fetch_size=100

# === OAuth2 (카카오) ===
# .env 파일에 KAKAO_CLIENT_ID 추가 필요. KAKAO_CLIENT_SECRET은 사용 시에만 추가.
spring.security.oauth2.client.registration.kakao.client-id=${KAKAO_CLIENT_ID:}
spring.security.oauth2.client.registration.kakao.client-secret=${KAKAO_CLIENT_SECRET:}

# 회원 탈퇴 시 카카오 연결 해제용 Admin Key. 카카오 개발자 콘솔 > 앱 설정 > 앱 키 > Admin Key.
# 미설정 시 unlink 스킵 (탈퇴는 정상 진행됨, 카카오 측 연결만 남음).
app.oauth.kakao.admin-key=${KAKAO_ADMIN_KEY:}
spring.security.oauth2.client.registration.kakao.client-authentication-method=client_secret_post
spring.security.oauth2.client.registration.kakao.authorization-grant-type=authorization_code
spring.security.oauth2.client.registration.kakao.redirect-uri={baseUrl}/login/oauth2/code/{registrationId}
spring.security.oauth2.client.registration.kakao.scope=profile_nickname
spring.security.oauth2.client.registration.kakao.client-name=Kakao

spring.security.oauth2.client.provider.kakao.authorization-uri=https://kauth.kakao.com/oauth/authorize
spring.security.oauth2.client.provider.kakao.token-uri=https://kauth.kakao.com/oauth/token
spring.security.oauth2.client.provider.kakao.user-info-uri=https://kapi.kakao.com/v2/user/me
spring.security.oauth2.client.provider.kakao.user-name-attribute=id

# === OAuth2 (구글) ===
# Spring Security가 google provider를 내장 지원하므로 provider URL은 별도 설정 불필요.
# .env에 GOOGLE_CLIENT_ID / GOOGLE_CLIENT_SECRET 추가 필요.
spring.security.oauth2.client.registration.google.client-id=${GOOGLE_CLIENT_ID:}
spring.security.oauth2.client.registration.google.client-secret=${GOOGLE_CLIENT_SECRET:}
spring.security.oauth2.client.registration.google.scope=profile,email

# === OAuth2 (네이버) ===
# 네이버는 Spring Security 내장 provider가 아니므로 provider URL을 직접 지정.
# 콘솔 'OAuth 동의항목'에서 이메일/별명/성별/생일/출생연도 체크되어 있어야 응답으로 옴.
spring.security.oauth2.client.registration.naver.client-id=${NAVER_CLIENT_ID:}
spring.security.oauth2.client.registration.naver.client-secret=${NAVER_CLIENT_SECRET:}
spring.security.oauth2.client.registration.naver.client-authentication-method=client_secret_post
spring.security.oauth2.client.registration.naver.authorization-grant-type=authorization_code
spring.security.oauth2.client.registration.naver.redirect-uri={baseUrl}/login/oauth2/code/{registrationId}
spring.security.oauth2.client.registration.naver.scope=name,email,gender,birthday,birthyear
spring.security.oauth2.client.registration.naver.client-name=Naver

spring.security.oauth2.client.provider.naver.authorization-uri=https://nid.naver.com/oauth2.0/authorize
spring.security.oauth2.client.provider.naver.token-uri=https://nid.naver.com/oauth2.0/token
spring.security.oauth2.client.provider.naver.user-info-uri=https://openapi.naver.com/v1/nid/me
spring.security.oauth2.client.provider.naver.user-name-attribute=response

# OAuth 인증 성공 시 프론트의 콜백 페이지 (.env에서 override 가능)
app.oauth2.frontend-redirect=${OAUTH2_FRONTEND_REDIRECT:http://localhost:5173/oauth/callback}

# === JWT / Refresh Token 만료 시간 ===
# access token: 30분 (1800000ms). 테스트 시 .env에서 JWT_ACCESS_TOKEN_EXPIRATION_MS로 override.
app.jwt.access-token-expiration-ms=${JWT_ACCESS_TOKEN_EXPIRATION_MS:1800000}

# refresh token: 365일 (31536000000ms). 로그인 상태 유지 UX 지원.
# 활성 사용자는 rotation으로 사실상 영구 로그인. 1년간 미사용 시 재로그인 강제.
# 테스트 시 .env에서 REFRESH_TOKEN_EXPIRATION_MS로 override.
app.jwt.refresh-token-expiration-ms=${REFRESH_TOKEN_EXPIRATION_MS:31536000000}

# 재사용 탐지 grace period (초): rotation으로 폐기된 직후 N초 내에 재제출되면
# multi-tab race로 간주해 도난 처리 안 함. 너무 길면 도난 탐지 둔해짐, 너무 짧으면 정상 다탭 사용자가 강제 로그아웃됨.
app.refresh-token.reuse-grace-seconds=${REFRESH_TOKEN_REUSE_GRACE_SECONDS:30}

# 폐기된 토큰 row 보존 기간 (시간): 이 시간이 지나면 cleanup 스케줄러가 삭제.
# 보존 동안엔 재사용 탐지 가능. 짧으면 도난 탐지 시간 줄어듦, 길면 DB 부피 커짐.
app.refresh-token.revoked-retention-hours=${REFRESH_TOKEN_REVOKED_RETENTION_HOURS:24}

# === CORS / JWT secret (병합 시 추가) ===
# SecurityConfig가 cors.allowed.origins로 변경됨. setAllowedOriginPatterns용 wildcard 패턴 그대로.
cors.allowed.origins=${ALLOWED_ORIGINS:http://localhost:*,http://127.0.0.1:*}

# JwtUtil이 jwt.secret으로 변경됨. 환경변수 미설정 시 안전한 64바이트 기본키.
jwt.secret=${JWT_SECRET_KEY:this_is_a_very_long_default_secret_key_for_local_development_environment_12345!}

# === DB Connection Pool (HikariCP) ===
# Supabase 무료 티어 제한을 고려하여 최대 커넥션 수를 10개로 제한
spring.datasource.hikari.maximum-pool-size=10
# (위쪽의 connection-timeout=30000은 한 번 쓰이고, 아래는 더 빠르게 fail-fast 하는 값. 후자가 적용됨)
spring.datasource.hikari.connection-timeout=20000

# === Audit Log 설정 ===
# 감사 로그 보관 주기 (일 단위)
app.audit.retention-days=180

# === 외부 AI 서버 설정 (FastAPI) ===
# 환경변수 AI_SERVER_URL이 있으면 그걸 쓰고, 없으면 로컬 주소를 기본으로 사용함
ai.server.url=${AI_SERVER_URL:http://localhost:8000/api/recommend}

# === Gemini Vision API (식재료 사진 인식) ===
# .env에 GEMINI_API_KEY 추가. 키가 비어있으면 /recognize 엔드포인트가 503 반환.
gemini.api.key=${GEMINI_API_KEY:}

# === 이메일 (Gmail SMTP) ===
# .env에 MAIL_USERNAME (Gmail 주소) + MAIL_APP_PASSWORD (앱 비밀번호 16자리) 설정.
# myaccount.google.com/apppasswords 에서 발급.
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_APP_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true

# 메일에 적힐 발신자 표시명 + 사용자가 클릭할 링크의 base URL
app.mail.from-name=${MAIL_FROM_NAME:냉부해}
app.mail.web-base-url=${MAIL_WEB_BASE_URL:http://localhost:5173}
# multipart 파일 크기 제한 (Spring 기본은 1MB라 사진 보내면 잘리는 경우 있음)
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB
